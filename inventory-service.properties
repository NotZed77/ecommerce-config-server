
server.servlet.context-path=/inventory
server.port=9010

spring.datasource.url=jdbc:postgresql://${DB-SERVICE:inventory-db}:5432/${DB_NAME:inventoryDB}
spring.datasource.username=${DB_USERNAME:postgres}
