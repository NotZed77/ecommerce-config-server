spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: order-service
            uri: ${ORDER_SERVICE_URI:lb://ORDER-SERVICE}
            predicates:
              - Path=/api/v1/order/**
            filters:
              - StripPrefix=2
              - AddRequestHeader=X-Custom-Header, zed
              - name: LoggingOrdersFilter
              - name: Authentication
                args:
                  isEnabled: false
              - name: Authorization
                args:
                 allowedRoles: ADMIN, SUPER_ADMIN
          - id: inventory-service
            uri: ${INVENTORY_SERVICE_URI:lb://INVENTORY-SERVICE}
            predicates:
              - Path=/api/v1/inventory/**
            filters:
              - StripPrefix=2
              - AddRequestHeader=X-Custom-Header, zed

          - id: shipping-service
            uri: lb://SHIPPING-SERVICE
            predicates:
              - Path=/api/v1/shipping/**
            filters:
              - StripPrefix=2
              - AddRequestHeader=X-Custom-Header, zed
              - name: Authentication


server:
  port: 8080
