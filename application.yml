server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/NotZed77/ecommerce-config-server
          default-label: main
          clone-on-start: true

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
