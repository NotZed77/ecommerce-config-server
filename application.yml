eureka.client.service-url.defaultZone: http://discovery-server:8761/eureka 

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing: 
      endpoint: http://zipkin:9411/api/v2/spans

spring:
  jpa:
    show-sql: true
    properties.hibernate.format_sql: true
    hibernate.ddl-auto: create-drop
